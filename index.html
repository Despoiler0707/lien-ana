<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#082357">
<meta name="apple-mobile-web-app-title" content="Outils d'Ana">
<title>Outils d'études d'Ana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23082357'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='34' fill='%23F5E72F' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Staatliches&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#082357;        /* bleu marine du cégep */
  --navy-2:#102253;
  --yellow:#F5E72F;      /* jaune du cégep */
  --blue:#197EA9;        /* bleu des liens */
  --sky:#3DB0E2;         /* bleu ciel d'accent */
  --bg:#f4f4f4;
  --card:#ffffff;
  --ink:#212121;
  --muted:#6b7280;
  --line:#e3e6ec;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Open Sans",Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}

/* Bandeau */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:46px 20px 70px}
.hero::before{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;background:var(--sky);opacity:.18}
.hero::after{content:"";position:absolute;left:-80px;bottom:-160px;width:300px;height:300px;border-radius:50%;background:var(--yellow);opacity:.12}
.hero-in{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.kicker{display:inline-block;background:var(--yellow);color:var(--navy);font-family:Staatliches,Impact,sans-serif;letter-spacing:1.5px;font-size:15px;padding:4px 12px;border-radius:6px}
h1{font-family:Staatliches,Impact,sans-serif;font-weight:400;font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:.5px;margin:14px 0 10px;max-width:820px}
h1 .hl{color:var(--yellow)}
.heart{display:inline-block;color:var(--yellow);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.lead{color:rgba(255,255,255,.78);font-size:16px;margin:0}

/* Tuiles */
main{max-width:1000px;margin:-40px auto 0;padding:0 20px 50px;position:relative;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;text-decoration:none;color:inherit;
  box-shadow:0 6px 20px rgba(8,35,87,.08);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent,var(--blue))}
a.tile:hover,a.tile:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(8,35,87,.16);border-color:var(--accent,var(--blue));outline:none}
.top{display:flex;align-items:center;gap:12px}
.ico{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:var(--yellow);font-weight:700;font-size:17px;letter-spacing:-.3px}
.ico sub{font-size:.62em;line-height:0}
.ico sup{font-size:.62em;line-height:0}
.tag{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--accent,var(--blue))}
.tile h2{font-family:Staatliches,Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.4px;margin:0;color:var(--navy);line-height:1.05}
.tile p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45;flex:1}
.go{font-weight:700;font-size:14px;color:var(--accent,var(--blue));display:flex;align-items:center;gap:6px}
.go span{transition:transform .18s}
a.tile:hover .go span{transform:translateX(4px)}
.tile.soon{background:transparent;border:2px dashed #cfd4de;box-shadow:none;cursor:default}
.tile.soon::before{display:none}
.tile.soon .ico{background:#e7eaf0;color:#9aa2b1}
.tile.soon h2{color:#8a92a3}

footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 30px}
@media (max-width:560px){
  .hero{padding:34px 18px 64px}
  main{padding:0 14px 40px}
}
@media (prefers-reduced-motion:reduce){.heart{animation:none}.tile,.go span{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <span class="kicker">Étude - Ana</span>
    <h1>Mes outils d'études que mon <span class="hl">papa d'amour</span> me fait!!! <span class="heart">♥</span></h1>
    <p class="lead">Choisis un outil pour commencer.</p>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer id="foot"></footer>

<script>
/* ============================================================
   LISTE DES OUTILS - pour en ajouter un, copie un bloc { ... }
   - titre   : nom de la tuile
   - matiere : petite étiquette en couleur
   - desc    : une phrase
   - lien    : adresse de l'outil
   - icone   : 1 à 4 caractères (H2O devient H₂O)
   - couleur : facultatif (ex. "#3DB0E2")
   - bientot : true = tuile grise non cliquable
   ============================================================ */
var OUTILS = [
  {
    titre:   "Ions polyatomiques",
    matiere: "Chimie · Chapitre 2",
    desc:    "Les 38 ions de la section 2.3.4 : retrouve la formule, la charge et le nom.",
    lien:    "https://despoiler0707.github.io/ions-polyatomiques/",
    icone:   "SO4"
  },
  {
    titre:   "Prochain outil",
    matiere: "À venir",
    desc:    "Dis à papa ce que tu veux pratiquer ensuite!",
    icone:   "?",
    bientot: true
  }
];

(function(){
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function ico(s){return esc(s).replace(/(\d+)/g,"<sub>$1</sub>");}
  var g=document.getElementById("grid"),html="";
  OUTILS.forEach(function(o){
    var style=o.couleur?' style="--accent:'+esc(o.couleur)+'"':"";
    var inner='<div class="top"><div class="ico"><span>'+ico(o.icone||"•")+'</span></div><div><div class="tag">'+esc(o.matiere||"")+'</div><h2>'+esc(o.titre)+'</h2></div></div>'+
              '<p>'+esc(o.desc||"")+'</p>'+
              (o.bientot?'':'<div class="go">Ouvrir <span>→</span></div>');
    html+=o.bientot
      ? '<div class="tile soon"'+style+'>'+inner+'</div>'
      : '<a class="tile" href="'+esc(o.lien)+'"'+style+'>'+inner+'</a>';
  });
  g.innerHTML=html;
  var n=OUTILS.filter(function(o){return !o.bientot;}).length;
  document.getElementById("foot").textContent=n+(n>1?" outils disponibles":" outil disponible");
})();
</script>
</body>
</html>
